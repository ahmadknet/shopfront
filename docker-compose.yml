services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopfront
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopfront"]
      interval: 5s
      retries: 10

  api:
    build: ./backend/ShopApi
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=shopfront;Username=postgres;Password=postgres
      Jwt__Key: dev-only-change-me-please-32-chars-minimum!!
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
